[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coralguard"
version = "1.0.0"
description = "Satellite heat stress on Brazil's coral reefs, from NOAA Coral Reef Watch data, with an interactive dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Henry Noguchi" }]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
coralguard = "coralguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coralguard = ["site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
